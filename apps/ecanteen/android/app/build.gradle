plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ecanteen.zishof"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ecanteen.zishof"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Satu dimensi varian; yang berbeda HANYA label peluncur.
    //
    // Kedua varian memakai applicationId yang sama (com.ecanteen.zishof)
    // karena itulah paket yang terdaftar di Google Play. Konsekuensinya
    // keduanya menempati slot pemasangan yang sama -- satu perangkat hanya
    // bisa memuat salah satunya, dan memasang yang lain akan menggantikannya.
    flavorDimensions += "product"
    productFlavors {
        create("umum") {
            dimension = "product"
            resValue("string", "app_name", "eCanteen")
        }
        create("petra") {
            dimension = "product"
            resValue("string", "app_name", "Direktorat Pengembangan Usaha Sosial")
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
