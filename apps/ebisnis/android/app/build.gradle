plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Signing release opsional via android/key.properties (TIDAK di-commit; berisi
// storeFile/storePassword/keyAlias/keyPassword). Bila file tidak ada, release
// tetap memakai debug key seperti sebelumnya (perilaku lama TIDAK berubah) --
// penyediaan keystore produksi = keputusan pemilik (lihat docs/pos-inventory-sales/
// uat-required.md). Jangan generate keystore sembarangan di build machine.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "id.zishof.ebisnis"
    // Eksplisit 36 (bukan flutter.compileSdkVersion bawaan) -- mobile_scanner (camera scan Stok
    // Opname) butuh compileSdk 36+ krn dependensi androidx.camera 1.5.0-nya.
    compileSdk = 36
    // Eksplisit -- mobile_scanner/path_provider/shared_preferences/sqflite semua minta
    // NDK 27.0.12077973, lebih tinggi dari default flutter.ndkVersion (26.x).
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "id.zishof.ebisnis"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // 23 (bukan flutter.minSdkVersion bawaan, biasanya 21) -- mobile_scanner's androidx.camera
        // 1.5.0 mensyaratkan Android 6.0+. Android <6.0 sudah sangat minoritas di 2026.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Varian produk (PERINTAH_MASTER Â§4.3): flavor `ebisnis` = perilaku lama
    // persis (applicationId & label APK tak berubah); `inventorySales` = varian
    // "eBisnis Inventory & Sales" dgn applicationId sendiri supaya bisa
    // terpasang berdampingan dgn POS existing di perangkat yang sama.
    // PERHATIAN: begitu flavor dideklarasikan, SEMUA build Android wajib
    // menyertakan --flavor (perintah lama `flutter build apk --release` polos
    // tidak jalan lagi) -- pakai wrapper tool/build_apk_ebisnis.ps1 /
    // tool/build_apk_inventory_sales.ps1 supaya tidak lupa.
    flavorDimensions = ["product"]
    productFlavors {
        ebisnis {
            dimension "product"
            applicationId "id.zishof.ebisnis"
            resValue "string", "app_name", "ebisnis"
        }
        inventorySales {
            dimension "product"
            applicationId "id.zishof.ebisnis.inventorysales"
            resValue "string", "app_name", "eBisnis Inventory & Sales"
        }
        emedik {
            dimension "product"
            applicationId "id.zishof.ebisnis.emedik"
            resValue "string", "app_name", "eBisnis POS eMedik"
        }
        apotik {
            dimension "product"
            applicationId "id.zishof.ebisnis.apotik"
            resValue "string", "app_name", "eBisnis POS Apotik"
        }
        albahjah {
            dimension "product"
            applicationId "id.zishof.ebisnis.albahjah"
            resValue "string", "app_name", "Al-Bahjah POS"
        }
        nahl {
            dimension "product"
            applicationId "id.zishof.ebisnis.nahl"
            resValue "string", "app_name", "FF (Fajrul Falah) Mart"
        }
        mitrainap {
            dimension "product"
            applicationId "id.zishof.mitrainap"
            resValue "string", "app_name", "MitraInap"
        }
        petra {
            dimension "product"
            applicationId "id.zishof.ebisnis.petra"
            resValue "string", "app_name", "eKantin Petra"
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // key.properties tersedia -> tanda tangan produksi; kalau tidak,
            // fallback debug key (perilaku lama, supaya `flutter run --release`
            // tetap jalan di mesin dev tanpa keystore).
            signingConfig = keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
