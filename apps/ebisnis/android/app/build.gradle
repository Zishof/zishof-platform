plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "id.zishof.ebisnis"
    // Eksplisit 36 (bukan flutter.compileSdkVersion bawaan) -- mobile_scanner (camera scan Stok
    // Opname) butuh compileSdk 36+ krn dependensi androidx.camera 1.5.0-nya.
    compileSdk = 36
    // Eksplisit -- mobile_scanner/path_provider/shared_preferences/sqflite semua minta
    // NDK 27.0.12077973, lebih tinggi dari default flutter.ndkVersion (26.x).
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "id.zishof.ebisnis"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // 23 (bukan flutter.minSdkVersion bawaan, biasanya 21) -- mobile_scanner's androidx.camera
        // 1.5.0 mensyaratkan Android 6.0+. Android <6.0 sudah sangat minoritas di 2026.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
