org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Project UAT dapat berada di drive E: sementara Pub cache Flutter berada di C:.
# Cache inkremental Kotlin tidak dapat merelatifkan sumber lintas-drive dan dapat
# gagal saat menutup cache. Kompilasi in-process non-inkremental lebih lambat,
# tetapi deterministik pada kedua tata letak workstation tersebut.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# JDK dipilih oleh Flutter (`flutter config --jdk-dir ...`) atau JAVA_HOME
# mesin build. Jangan hardcode path lokal: itu membuat checkout gagal dibangun
# di komputer lain ketika folder tersebut tidak ada.
