name: Test Al-Bahjah Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/ebisnis
        run: flutter pub get

      - name: Test clean startup and login in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          POS_TEST_USERNAME: ${{ secrets.POS_TEST_USERNAME }}
          POS_TEST_PASSWORD: ${{ secrets.POS_TEST_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >-
            test -n "$POS_TEST_USERNAME" && test -n "$POS_TEST_PASSWORD" &&
            cd apps/ebisnis &&
            flutter test integration_test/android_startup_login_test.dart
            -d emulator-5554
            --flavor albahjah
            --dart-define=EBISNIS_VARIANT=albahjah
            --dart-define=POS_TEST_USERNAME="$POS_TEST_USERNAME"
            --dart-define=POS_TEST_PASSWORD="$POS_TEST_PASSWORD"
