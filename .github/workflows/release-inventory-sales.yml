name: Release Inventory Sales

on:
  push:
    tags:
      - inventory-sales-v*

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.1
          cache: true
      - name: Resolve dependencies
        working-directory: apps/ebisnis
        run: flutter pub get
      - name: Use runner JDK
        shell: bash
        run: sed -i '/^org\.gradle\.java\.home=/d' apps/ebisnis/android/gradle.properties
      - name: Build Inventory Sales APK
        working-directory: apps/ebisnis
        shell: bash
        run: >-
          set -o pipefail;
          flutter build apk --release --flavor inventorySales
          -t lib/main_inventory_sales.dart
          --dart-define=EBISNIS_VARIANT=inventory_sales 2>&1 | tee build-android.log
          || { tail -n 80 build-android.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'
          | sed 's/^/::error title=Android build failed::/'; exit 1; }
      - name: Name APK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#inventory-sales-v}"
          mkdir -p release
          cp apps/ebisnis/build/app/outputs/flutter-apk/app-inventorysales-release.apk \
            "release/eBisnis-Inventory-Sales-${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-sales-android
          path: release/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.1
          cache: true
      - name: Resolve dependencies
        working-directory: apps/ebisnis
        run: flutter pub get
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build Inventory Sales installer
        working-directory: apps/ebisnis
        shell: powershell
        run: |
          $output = & flutter build windows --release `
            -t lib/main_inventory_sales.dart `
            --dart-define=EBISNIS_VARIANT=inventory_sales 2>&1
          $buildExit = $LASTEXITCODE
          $output | Tee-Object -FilePath build-windows.log
          if ($buildExit -ne 0) {
            $tail = (($output | Select-Object -Last 80) -join "`n")
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build failed::$tail"
            exit 1
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc "/DAppVersion=$version" installer\inventory_sales.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Name installer
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^inventory-sales-v', ''
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "apps/ebisnis/installer/dist/eBisnis-Inventory-Sales-Setup-$version.exe" `
            "release/eBisnis-Inventory-Sales-Setup-$version.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-sales-windows
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: inventory-sales-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.apk *.exe > SHA256SUMS.txt
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: eBisnis Inventory & Sales ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/*.exe
            release/SHA256SUMS.txt
